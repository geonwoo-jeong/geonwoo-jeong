<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Geonwoo Jeong profile control panel</title>
  <desc id="desc">A dark space-inspired interface introducing Geonwoo Jeong, a software writer based in Tokyo.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060913"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#10132a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".38"/>
      <stop offset=".48" stop-color="#22d3ee" stop-opacity=".12"/>
      <stop offset="1" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#64748b" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <clipPath id="panel">
      <rect x="18" y="18" width="1164" height="384" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="420" fill="url(#background)"/>
  <rect x="18" y="18" width="1164" height="384" rx="22" fill="url(#grid)" stroke="#94a3b8" stroke-opacity=".24"/>

  <g clip-path="url(#panel)">
    <circle cx="930" cy="205" r="280" fill="url(#halo)"/>
    <path d="M-20 352C234 282 364 410 630 335S988 236 1230 310" fill="none" stroke="url(#accent)" stroke-opacity=".17" stroke-width="1.5"/>
    <path d="M-40 375C215 307 392 438 654 360S1016 258 1240 338" fill="none" stroke="#22d3ee" stroke-opacity=".08"/>

    <g fill="#e2e8f0">
      <circle cx="78" cy="78" r="1.5" opacity=".7"/>
      <circle cx="154" cy="48" r="1" opacity=".45"/>
      <circle cx="245" cy="92" r="1.2" opacity=".5"/>
      <circle cx="338" cy="54" r="1.1" opacity=".58"/>
      <circle cx="472" cy="102" r="1.4" opacity=".36"/>
      <circle cx="566" cy="58" r="1" opacity=".52"/>
      <circle cx="674" cy="92" r="1.3" opacity=".4"/>
      <circle cx="757" cy="43" r="1.2" opacity=".62"/>
      <circle cx="1068" cy="71" r="1.4" opacity=".7"/>
      <circle cx="1130" cy="119" r="1" opacity=".45"/>
      <circle cx="1090" cy="330" r="1.2" opacity=".5"/>
      <circle cx="975" cy="366" r="1.1" opacity=".56"/>
      <circle cx="728" cy="360" r="1.4" opacity=".42"/>
      <circle cx="519" cy="378" r="1" opacity=".48"/>
      <circle cx="294" cy="354" r="1.2" opacity=".5"/>
      <circle cx="112" cy="326" r="1.1" opacity=".54"/>
    </g>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <g transform="translate(54 49)">
      <circle cx="6" cy="6" r="6" fill="#34d399" filter="url(#glow)"/>
      <text x="22" y="11" fill="#94a3b8" font-size="13" letter-spacing="2">GEONWOO.NODE / TOKYO</text>
    </g>

    <g transform="translate(1008 42)">
      <rect width="128" height="30" rx="15" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-opacity=".45"/>
      <circle cx="19" cy="15" r="4" fill="#34d399"/>
      <text x="34" y="20" fill="#6ee7b7" font-size="12" letter-spacing="2">ONLINE</text>
    </g>

    <g transform="translate(58 130)">
      <text x="0" y="0" fill="#f8fafc" font-size="52" font-weight="700" letter-spacing="1">GEONWOO JEONG</text>
      <rect x="0" y="23" width="482" height="3" rx="1.5" fill="url(#accent)"/>
      <text x="0" y="72" fill="#cbd5e1" font-size="21" letter-spacing="1.3">NOT AN ENGINEER. I WRITE SOFTWARE.</text>
      <text x="0" y="112" fill="#64748b" font-size="14" letter-spacing="2.4">SOFTWARE · LANGUAGE · AGENT INTERFACES</text>
    </g>

    <g transform="translate(905 208)">
      <circle r="110" fill="none" stroke="#818cf8" stroke-opacity=".18"/>
      <circle r="76" fill="none" stroke="#22d3ee" stroke-opacity=".24" stroke-dasharray="5 8"/>
      <circle r="42" fill="#111827" stroke="url(#accent)" stroke-width="1.5"/>
      <circle r="34" fill="none" stroke="#c084fc" stroke-opacity=".25"/>
      <text x="0" y="8" text-anchor="middle" fill="#f8fafc" font-size="23" font-weight="700" letter-spacing="3">GW</text>

      <g transform="translate(-93 -48)">
        <circle r="7" fill="#22d3ee" filter="url(#glow)"/>
        <text x="-14" y="-14" text-anchor="middle" fill="#67e8f9" font-size="10" letter-spacing="1.5">CONTEXT</text>
      </g>
      <g transform="translate(88 -43)">
        <circle r="7" fill="#a78bfa" filter="url(#glow)"/>
        <text x="15" y="-14" text-anchor="middle" fill="#c4b5fd" font-size="10" letter-spacing="1.5">SYSTEMS</text>
      </g>
      <g transform="translate(7 76)">
        <circle r="7" fill="#34d399" filter="url(#glow)"/>
        <text x="0" y="26" text-anchor="middle" fill="#6ee7b7" font-size="10" letter-spacing="1.5">LANGUAGE</text>
      </g>
    </g>

    <g transform="translate(58 328)">
      <rect width="650" height="48" rx="8" fill="#0f172a" fill-opacity=".72" stroke="#475569" stroke-opacity=".35"/>
      <line x1="216" y1="9" x2="216" y2="39" stroke="#475569" stroke-opacity=".35"/>
      <line x1="432" y1="9" x2="432" y2="39" stroke="#475569" stroke-opacity=".35"/>

      <text x="18" y="19" fill="#64748b" font-size="9" letter-spacing="1.5">LOCATION</text>
      <text x="18" y="36" fill="#e2e8f0" font-size="12" letter-spacing="1">TOKYO, JP</text>

      <text x="234" y="19" fill="#64748b" font-size="9" letter-spacing="1.5">AFFILIATION</text>
      <text x="234" y="36" fill="#e2e8f0" font-size="12" letter-spacing=".7">KINTO TECHNOLOGIES</text>

      <text x="450" y="19" fill="#64748b" font-size="9" letter-spacing="1.5">OPERATING MODE</text>
      <text x="450" y="36" fill="#e2e8f0" font-size="12" letter-spacing=".7">HUMAN-FIRST</text>
    </g>

    <text x="1138" y="378" text-anchor="end" fill="#475569" font-size="10" letter-spacing="1.6">PROFILE INTERFACE / 2026</text>
  </g>
</svg>
